<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesi Robot Meja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DotGothic16&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column; the LED robot head is the single bold element, everything else stays quiet. */
:root{
  --bg:#eef1ee; --surface:#fbfcfb; --ink:#17211e; --muted:#58675f; --line:#d3dbd6;
  --accent:#0e6b5c; --accent-ink:#ffffff; --warn:#a15c00;
  --plate:#11171a; --led:#ffb547; --led-dim:#2b2415;
  --ring-idle:#3a4a50; --ring-listen:#5cc8ff; --ring-think:#ffb547; --ring-speak:#5fe3a1;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-dot:'DotGothic16',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172120; --ink:#e6eeea; --muted:#9db0a8; --line:#263330;
    --accent:#4fd1b5; --accent-ink:#04231c; --warn:#f0b35a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --ink:#e6eeea; --muted:#9db0a8; --line:#263330;
  --accent:#4fd1b5; --accent-ink:#04231c; --warn:#f0b35a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font-b)}
.app{max-width:860px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font:700 15px var(--font-d);letter-spacing:.03em;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:600 13px var(--font-b);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;line-height:1.14;margin:0 0 .5em}
h1{font-size:clamp(28px,5.4vw,42px)}
h2{font-size:26px}
h3{font-size:18px}
p{margin:0 0 .8em}
ul,ol{margin:0 0 .8em;padding-left:1.2em}
li{margin:.2em 0}
.lead{color:var(--muted);max-width:62ch;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.kicker{font:600 13px var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:18px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px;margin-bottom:14px}
.btn{font:600 16px var(--font-b);padding:12px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.choice[aria-pressed="true"],.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:500 14px var(--font-b);padding:8px 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{font:500 17px var(--font-b);padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-right:10px;vertical-align:-4px}
.checks{list-style:none;padding:0;margin:0}
.checks li{margin:.55em 0}
.checks label,.consent{cursor:pointer;display:block}
.consent{margin:16px 0}
.field label{font-weight:600}
.field input[type=text]{width:100%;margin-top:8px}
.code{font-size:30px;letter-spacing:.12em;margin:4px 0}
.dot{font-family:var(--font-dot);font-variant-numeric:tabular-nums}
.steps li{margin:.5em 0}
.scale{display:flex;gap:8px;margin:10px 0 4px}
.scale button{flex:1;font:600 17px var(--font-b);padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.scalelabels{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;gap:12px}
textarea{width:100%;font:13px/1.45 ui-monospace,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 10px}
.big{font:700 clamp(26px,5vw,38px)/1.2 var(--font-d);text-align:center;margin:18px 0 8px;text-wrap:balance}

/* stage: HUD + robot */
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hud span:first-child{font:600 14px var(--font-b);color:var(--muted)}
.hud .dot{font-size:30px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.robot{width:min(320px,100%);margin:6px auto 0}
.robot svg{display:block;width:100%;height:auto}
.caption{min-height:3.1em;text-align:center;margin:10px auto 12px;max-width:46ch;font-weight:500}
@media (min-width:760px){.stack.two{grid-template-columns:1fr 1fr;align-items:start}}
.caption.idle{color:var(--muted);font-weight:400}
.px{fill:var(--led-dim)}
.px.on{fill:var(--led)}
.ring{stroke:var(--ring-idle);stroke-width:6;fill:none;transition:stroke .25s}
svg[data-ring="listen"] .ring{stroke:var(--ring-listen);animation:pulse 1.1s ease-in-out infinite}
svg[data-ring="speak"] .ring{stroke:var(--ring-speak);animation:pulse 1.6s ease-in-out infinite}
svg[data-ring="think"] .ring{stroke:var(--ring-think);stroke-dasharray:30 70;animation:chase 1.3s linear infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes chase{to{stroke-dashoffset:-100}}

/* block panels */
.say{font-size:21px;margin-bottom:.5em}
.pzq{font-size:34px;letter-spacing:.14em;margin:6px 0 12px}
.pzq.seq{letter-spacing:.06em}
#pzIn{flex:1 1 160px}
.banner{border-left:5px solid var(--warn);background:var(--surface);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-weight:600}
.ok{color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px;z-index:10}
.overlay .card{max-width:380px}
#camPreview{display:block;width:100%;max-width:360px;margin:12px 0;border-radius:12px;background:#000;transform:scaleX(-1)}
.checks.small li{margin:.3em 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" data-i="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <!-- Stage: robot face + HUD, shown during calibration and blocks -->
    <div id="stage" hidden>
      <div class="hud"><span id="hudLabel"></span><span id="hudTime" class="dot"></span></div>
      <div class="bar"><i id="hudBar"></i></div>
      <div class="robot">
        <svg id="robot" viewBox="0 0 360 230" data-ring="idle" role="img" aria-label="Robot">
          <defs>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect x="6" y="6" width="348" height="218" rx="56" fill="var(--plate)"/>
          <rect class="ring" x="18" y="18" width="324" height="194" rx="46" pathLength="100"/>
          <g id="eyeL" transform="translate(60 67)" filter="url(#glow)"></g>
          <g id="eyeR" transform="translate(204 67)" filter="url(#glow)"></g>
        </svg>
      </div>
      <p id="caption" class="caption idle" aria-live="polite"></p>
    </div>

    <section id="s-intro" class="screen">
      <div id="recoverBar" class="banner" hidden><span data-i="recoverText"></span> <button type="button" class="btn" id="btnRecover" data-i="btnRecover"></button></div>
      <h1 data-i="introTitle"></h1>
      <p class="lead" data-i="introLead"></p>
      <div class="grid3">
        <div class="card"><h3 data-i="introDoTitle"></h3>
          <ul><li data-i="introDo1"></li><li data-i="introDo2"></li><li data-i="introDo3"></li></ul></div>
        <div class="card"><h3 data-i="introRecTitle"></h3><p data-i="introRec"></p></div>
        <div class="card"><h3 data-i="introRobotTitle"></h3><p data-i="introRobot"></p></div>
        <div class="card"><h3 data-i="introVolTitle"></h3><p data-i="introVol"></p></div>
      </div>
      <p id="contactLine" class="muted small" hidden></p>
      <p><button type="button" class="btn primary" id="btnToSetup" data-i="btnToSetup"></button></p>
    </section>

    <section id="s-setup" class="screen" hidden>
      <h2 data-i="setupTitle"></h2>
      <div class="card">
        <ul class="checks">
          <li><label><input type="checkbox" class="chk"><span data-i="chk1"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk2"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk3"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk4"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk5"></span></label></li>
        </ul>
      </div>
      <div class="grid3">
        <div class="card field">
          <label for="robotName" data-i="nameLabel"></label>
          <input type="text" id="robotName" maxlength="14" autocomplete="off">
        </div>
        <div class="card field">
          <label><input type="checkbox" id="voiceChk"><span data-i="voiceLabel"></span></label>
          <p id="voiceNote" class="muted small"></p>
        </div>
        <div class="card field">
          <div class="muted small" data-i="codeLabel"></div>
          <div id="sessCode" class="dot code"></div>
          <p class="small muted" data-i="codeHelp"></p>
        </div>
      </div>
      <div class="grid3" id="inviteWrap">
        <div class="card field">
          <label for="inviteIn" data-i="inviteLabel"></label>
          <input type="text" id="inviteIn" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
      </div>
      <div class="card" id="camCard" style="margin:14px 0">
        <h3 data-i="camTitle"></h3>
        <p class="small muted" data-i="camHelp"></p>
        <button type="button" class="btn" id="camBtn" data-i="camBtn"></button>
        <div id="camBox" hidden>
          <video id="camPreview" playsinline muted></video>
          <ul class="checks small"><li id="chkCam"></li><li id="chkLight"></li><li id="chkFace"></li></ul>
        </div>
        <p id="camMsg" class="small" aria-live="polite"></p>
      </div>
      <label class="consent"><input type="checkbox" id="consentChk"><span data-i="consentLabel"></span>
        <a id="consentLink" href="#" target="_blank" rel="noopener" hidden data-i="consentLink"></a></label>
      <p><button type="button" class="btn primary" id="btnStart" disabled data-i="btnStart"></button></p>
      <p class="muted small" data-i="startHint"></p>
    </section>

    <section id="s-calib" class="screen" hidden>
      <p id="calibText" class="big" aria-live="assertive"></p>
      <p class="muted" style="text-align:center" data-i="calibTip"></p>
    </section>

    <section id="s-blockintro" class="screen" hidden>
      <p class="kicker" id="biKicker"></p>
      <h2 id="biTitle"></h2>
      <p class="lead" id="biText"></p>
      <p><button type="button" class="btn primary" id="btnBlockStart" data-i="btnBlockStart"></button></p>
    </section>

    <section id="s-block" class="screen" hidden>
      <div id="breakBanner" class="banner" role="status" hidden></div>
      <div class="stack two">
        <div class="card">
          <div class="kicker" data-i="cardLabel"></div>
          <p class="say"><span id="wake" class="muted"></span> <strong id="say"></strong></p>
          <p class="small muted" data-i="spokeHint"></p>
          <div class="row">
            <button type="button" id="btnAsk" class="btn primary" data-i="btnAsk"></button>
            <button type="button" id="btnSkip" class="btn" data-i="btnSkip"></button>
          </div>
          <p id="nudge" class="small muted" style="margin:10px 0 0" hidden data-i="nudge"></p>
        </div>
        <div id="pzWrap" class="card">
          <div class="kicker" id="pzKicker"></div>
          <div id="pzQ" class="pzq dot"></div>
          <div class="row">
            <input type="text" id="pzIn" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Answer">
            <button type="button" id="pzCheck" class="btn" data-i="btnCheck"></button>
            <button type="button" id="pzSkip" class="btn ghost" data-i="btnPzSkip"></button>
          </div>
          <p id="pzMsg" class="small" style="margin:10px 0 0" aria-live="polite"></p>
        </div>
        <div id="freeWrap" class="card" hidden>
          <h3 data-i="freeTitle"></h3><p style="margin:0" data-i="freeText"></p>
        </div>
      </div>
    </section>

    <section id="s-rate" class="screen" hidden>
      <h2 data-i="rateTitle"></h2>
      <div class="stack">
        <div class="card">
          <p data-i="q1"></p>
          <div class="scale" id="arousalBtns" role="group" aria-label="1-5">
            <button type="button" data-v="1" aria-pressed="false">1</button>
            <button type="button" data-v="2" aria-pressed="false">2</button>
            <button type="button" data-v="3" aria-pressed="false">3</button>
            <button type="button" data-v="4" aria-pressed="false">4</button>
            <button type="button" data-v="5" aria-pressed="false">5</button>
          </div>
          <div class="scalelabels"><span data-i="q1lo"></span><span data-i="q1hi"></span></div>
        </div>
        <div class="card">
          <p data-i="q2"></p>
          <div class="row" id="botherBtns" role="group">
            <button type="button" class="btn choice" data-v="no" aria-pressed="false" data-i="q2no"></button>
            <button type="button" class="btn choice" data-v="yes" aria-pressed="false" data-i="q2yes"></button>
          </div>
        </div>
      </div>
      <p><button type="button" id="btnRateNext" class="btn primary" disabled></button></p>
    </section>

    <section id="s-end" class="screen" hidden>
      <h1 data-i="endTitle"></h1>
      <div class="stack">
        <div class="card">
          <p data-i="enjoy"></p>
          <div class="scale" id="enjoyBtns" role="group" aria-label="1-5">
            <button type="button" data-v="1" aria-pressed="false">1</button>
            <button type="button" data-v="2" aria-pressed="false">2</button>
            <button type="button" data-v="3" aria-pressed="false">3</button>
            <button type="button" data-v="4" aria-pressed="false">4</button>
            <button type="button" data-v="5" aria-pressed="false">5</button>
          </div>
          <div class="scalelabels"><span data-i="enjoyLo"></span><span data-i="enjoyHi"></span></div>
        </div>
          <div class="card" id="upCard">
          <h3 data-i="uploadTitle"></h3>
          <p id="upInfo" class="small muted"></p>
          <div class="bar"><i id="upBar"></i></div>
          <p id="upMsg" class="small" aria-live="polite"></p>
          <div class="row">
            <button type="button" id="btnSend" class="btn primary" disabled data-i="btnSend"></button>
            <button type="button" id="btnRetry" class="btn" hidden data-i="btnRetry"></button>
          </div>
          <div id="dlRow" class="row" style="margin-top:10px" hidden></div>
        </div>
        <p class="muted" style="margin:0" data-i="endFun"></p>
        <div class="card">
          <h3 data-i="logTitle"></h3>
          <p class="small muted" data-i="logHelp"></p>
          <textarea id="logOut" readonly rows="6" aria-label="Session log"></textarea>
          <div class="row">
            <button type="button" id="btnCopy" class="btn" data-i="btnCopy"></button>
            <button type="button" id="btnDl" class="btn ghost" data-i="btnDl"></button>
          </div>
          <p id="copyMsg" class="small" style="margin:10px 0 0" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <p style="text-align:center"><button type="button" id="btnAbort" class="link" hidden data-i="btnAbort"></button></p>
  </main>
</div>

<div id="confirm" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="confirmQ">
    <p id="confirmQ" style="font-weight:600" data-i="abortQ"></p>
    <div class="row">
      <button type="button" id="abortYes" class="btn primary" data-i="abortYes"></button>
      <button type="button" id="abortNo" class="btn" data-i="abortNo"></button>
    </div>
  </div>
</div>

<video id="camFeed" playsinline muted aria-hidden="true" style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<script>

/* ---------- Audio ---------- */
let AC = null;
function ac() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function sweep(f1, f2, dur, at = 0, gain = 0.18, type = 'triangle') {
  try {
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.linearRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.02); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
const CHIRP = {
  happy:() => { sweep(600, 900, .12); sweep(800, 1200, .14, .14); },
  curious:() => { sweep(500, 800, .15); sweep(700, 650, .12, .16); },
  sleepy:() => sweep(700, 350, .35),
  surprised:() => { sweep(900, 1400, .1); sweep(1400, 1100, .1, .1); },
  neutral:() => sweep(600, 700, .1),
  thinking:() => sweep(420, 440, .06, 0, .1)
};
function syncBeep() { [0, .3, .6].forEach(at => sweep(1000, 1000, .15, at, .3, 'sine')); sweep(1500, 1500, .3, .95, .3, 'sine'); }
function chime() { sweep(660, 660, .18, 0, .12, 'sine'); }

function refreshVoice() {
  const vs = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : [];
  S.voiceOk = vs.some(v => v.lang.toLowerCase().startsWith(S.lang));

  else if (!S.voiceTouched) chk.checked = true;
  $('voiceNote').textContent = S.voiceOk ? '' : t('voiceNA');
}
function speak(text) {
  return new Promise(res => {
    if (!S.voiceOn || !('speechSynthesis' in window)) return res();
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = speechSynthesis.getVoices().find(x => x.lang.toLowerCase().startsWith(S.lang));
      if (!v) return res();
      u.voice = v; u.lang = v.lang; u.pitch = 1.15; u.rate = 1;
      u.onend = () => res(); u.onerror = () => res();
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(res, 15000);
    } catch (e) { res(); }
  });
}

async function runBlock(key) {

  show('s-block'); setRing('idle'); setFace('neutral', 0, 0); caption(t('stIdle'), true);
  $('nudge').hidden = true; $('breakBanner').hidden = true;

    [[.2, 'br1'], [.5, 'br2'], [.78, 'br3']].forEach(([f, id]) => S.sched.push({ at: f * dur, fn: () => {
      const bn = $('breakBanner'); bn.textContent = t(id); bn.hidden = false; chime(); logEv('break_prompt', id);

}

/* ---------- Capture: camera, recording, head-pose features ---------- */
const MP_VER = '1.2.3';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const R = { stream:null, rec:null, chunks:[], seq:0, mime:'', ready:false, recording:false, lm:null, lmState:'idle',
  feat:[], tick:null, face:null, light:null, blob:null, cv:null, upload:{ state:'idle' }, sent:{}, recover:null };

// Head rotation from MediaPipe's 4x4 column-major matrix, order YXZ. Sign convention is unverified:
// check it in the pilot (turn head left/right, up/down) before interpreting signs. Analysis uses rest-pose deltas.
function euler(m) {
  const pitch = Math.asin(Math.max(-1, Math.min(1, -m[9])));
  const yaw = Math.atan2(m[8], m[10]);
  const roll = Math.atan2(m[1], m[5]);
  return [yaw, pitch, roll].map(a => a * 180 / Math.PI);
}

/* IndexedDB backup so a closed tab does not lose the recording */
const IDB = { db: null };
const idbReq = q => new Promise(res => { q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
async function idbOpen() {
  if (IDB.db) return IDB.db;
  try {
    IDB.db = await new Promise(res => {
      const q = indexedDB.open('deskrobot', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('chunks'); q.result.createObjectStore('meta'); };
      q.onsuccess = () => res(q.result); q.onerror = () => res(null);
    });
  } catch (e) { IDB.db = null; }
  return IDB.db;
}
async function idbPut(k, v) { try { const db = await idbOpen(); if (db) db.transaction('chunks', 'readwrite').objectStore('chunks').put(v, k); } catch (e) {} }
async function idbAll() { try { const db = await idbOpen(); return db ? (await idbReq(db.transaction('chunks').objectStore('chunks').getAll())) || [] : []; } catch (e) { return []; } }
async function idbMetaGet() { try { const db = await idbOpen(); return db ? await idbReq(db.transaction('meta').objectStore('meta').get('m')) : null; } catch (e) { return null; } }
async function idbMetaSet(v) { try { const db = await idbOpen(); if (db) db.transaction('meta', 'readwrite').objectStore('meta').put(v, 'm'); } catch (e) {} }
async function idbClear() {
  try { const db = await idbOpen(); if (!db) return;
    const tx = db.transaction(['chunks', 'meta'], 'readwrite'); tx.objectStore('chunks').clear(); tx.objectStore('meta').clear();
    await new Promise(res => { tx.oncomplete = res; tx.onerror = res; });
  } catch (e) {}
}

/* Camera check */
async function enableCamera() {
  const msg = $('camMsg'); msg.textContent = '';
  try {
    R.stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: 'user' },
      audio: WANT_VIDEO
    });
  } catch (e) { msg.textContent = t('camDenied'); return; }
  for (const id of ['camPreview', 'camFeed']) { const v = $(id); v.srcObject = R.stream; v.muted = true; try { await v.play(); } catch (e) {} }
  $('camBox').hidden = false; $('camBtn').hidden = true; R.ready = true;
  clearInterval(R.tick);
  let n = 0;
  R.tick = setInterval(() => { n++; if (R.recording || n % 5 === 0) analyseFrame(); if (n % 5 === 0) analyseLight(); }, 100);
  updateCheck(); loadLandmarker(); updateStart();
}
async function loadLandmarker() {
  if (R.lm || R.lmState === 'loading') return;
  R.lmState = 'loading'; updateCheck();
  try {
    if (window.__mockLandmarker) { R.lm = window.__mockLandmarker; R.lmState = 'ready'; }
    else {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
      const mod = await import(base + '/vision_bundle.mjs');
      const fs = await mod.FilesetResolver.forVisionTasks(base + '/wasm');
      R.lm = await mod.FaceLandmarker.createFromOptions(fs, {
        baseOptions: { modelAssetPath: MP_MODEL }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true
      });
      R.lmState = 'ready';
    }
  } catch (e) { R.lmState = 'fail'; }
  updateCheck(); updateStart();
}
function analyseLight() {
  const v = $('camFeed'); if (v.readyState < 2) return;
  const c = R.cv || (R.cv = document.createElement('canvas')); c.width = 32; c.height = 18;
  try {
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(v, 0, 0, 32, 18);
    const d = g.getImageData(0, 0, 32, 18).data; let s = 0;
    for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    R.light = s / (d.length / 4);
  } catch (e) {}
  updateCheck();
}
function analyseFrame() {
  const v = $('camFeed'); if (!R.lm || v.readyState < 2) return;
  let res = null;
  try { res = R.lm.detectForVideo(v, performance.now()); } catch (e) { return; }
  const lms = res && res.faceLandmarks && res.faceLandmarks[0];
  const tms = S.t0 == null ? 0 : Math.round(performance.now() - S.t0);
  if (!lms) { R.face = null; if (R.recording) R.feat.push([tms, 0, '', '', '', '', '', '']); updateCheck(); return; }
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for (const p of lms) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
  const m = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
  const e = m ? euler(m.data) : [NaN, NaN, NaN];
  R.face = { w: x1 - x0 };
  if (R.recording) R.feat.push([tms, 1, r2(e[0]), r2(e[1]), r2(e[2]), r2(x1 - x0), r2((x0 + x1) / 2), r2((y0 + y1) / 2)]);
  updateCheck();
}
function updateCheck() {
  if (!$('chkCam')) return;
  $('chkCam').textContent = (R.ready ? '✓ ' : '• ') + t(R.ready ? 'camOk' : 'camNo');
  $('chkLight').textContent = R.light == null ? '' : ((R.light < 60 ? '• ' : '✓ ') + t(R.light < 60 ? 'camDark' : 'camLightOk'));
  let f = '';
  if (R.lmState === 'loading') f = '• ' + t('faceLoading');
  else if (R.lmState === 'fail') f = '• ' + t('faceNA');
  else if (R.lmState === 'ready') {
    if (!R.face) f = '• ' + t('faceNone');
    else if (R.face.w < 0.18) f = '• ' + t('faceFar');
    else if (R.face.w > 0.65) f = '• ' + t('faceNear');
    else f = '✓ ' + t('faceOk');
  }
  $('chkFace').textContent = f;
}

/* Recording */
function pickMime() {
  const c = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4'];
  return c.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
}
async function beginCapture() {
  S.t0 = performance.now(); S.wall0 = new Date();
  logEv('session_start', S.wall0.toISOString());
  logEv('mode', MODE);
  R.recording = true; R.feat = []; R.chunks = []; R.seq = 0; R.blob = null; R.upload = { state: 'idle' }; R.sent = {}; S.recovered = false;
  if (WANT_VIDEO && R.stream && window.MediaRecorder) {
    try {
      await idbClear();
      R.mime = pickMime();
      await idbMetaSet({ code: S.code, invite: S.invite, mime: R.mime, t: Date.now() });
      R.rec = new MediaRecorder(R.stream, Object.assign({ videoBitsPerSecond: CONFIG.VIDEO_BPS, audioBitsPerSecond: 64000 }, R.mime ? { mimeType: R.mime } : {}));
      R.rec.ondataavailable = e => { if (e.data && e.data.size) { R.chunks.push(e.data); idbPut(R.seq++, e.data); } };
      R.rec.start(4000);
      logEv('rec_start', R.mime || 'default');
    } catch (e) { logEv('rec_error', e && e.message); }

}
function stopCapture() {
  return new Promise(res => {
    R.recording = false;
    const finish = () => {
      const type = (R.mime || 'video/webm').split(';')[0];
      R.blob = R.chunks.length ? new Blob(R.chunks, { type }) : null;
      clearInterval(R.tick);
      if (R.stream) R.stream.getTracks().forEach(tr => tr.stop());
      res();
    };
    if (R.rec && R.rec.state !== 'inactive') {
      R.rec.onstop = finish;
      try { R.rec.requestData(); R.rec.stop(); } catch (e) { finish(); }
    } else finish();
  });
}
function featCsv() {
  const head = ['# session_code=' + S.code, '# mode=' + MODE, '# euler_order=YXZ (sign convention unverified)', '# rate_hz=10', '# face=0 rows are missing data, not negatives', 't_ms,face,yaw_deg,pitch_deg,roll_deg,bbox_w,cx,cy'];
  return head.concat(R.feat.map(r => r.join(','))).join('\n');
}

/* Upload through the Apps Script relay (chunks are base64 in a text/plain POST, so no CORS preflight) */
async function api(body) {
  const r = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return await r.json();
}
const b64 = buf => {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
async function uploadBlob(blob, name, mime, onProgress) {
  const init = await api({ action: 'init', invite: S.invite, name, mime, size: blob.size });
  if (!init.ok) throw new Error(init.error || 'init');
  let off = 0, fails = 0;
  while (off < blob.size) {
    const end = Math.min(off + CONFIG.CHUNK, blob.size);
    try {
      const buf = await blob.slice(off, end).arrayBuffer();
      const r = await api({ action: 'chunk', sid: init.sid, offset: off, total: blob.size, data: b64(buf) });
      if (!r.ok) throw new Error(r.error || 'chunk');
      off = typeof r.received === 'number' ? r.received : end; fails = 0;
      onProgress(off / blob.size);
    } catch (e) {
      if (++fails > 6) throw e;
      await sleep(Math.min(8000, 1000 * fails));
      try { const st = await api({ action: 'status', sid: init.sid, total: blob.size }); if (st.ok && typeof st.received === 'number') off = st.received; } catch (e2) {}
    }
  }
}
function showDownloads(items) {
  const row = $('dlRow'); row.textContent = '';
  items.forEach(it => {
    const a = document.createElement('a'); a.className = 'btn'; a.download = it.name;
    a.href = URL.createObjectURL(it.blob); a.textContent = t('btnDl2', { n: it.name }); row.appendChild(a);
  });
  row.hidden = false;
}
async function sendAll() {
  if (R.upload.state === 'running') return;
  const mime = (R.mime || 'video/webm').split(';')[0], ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const items = [];
  if (!S.recovered) {
    items.push({ name: S.code + '_events.csv', mime: 'text/csv', blob: new Blob([csvText()], { type: 'text/csv' }) });
    items.push({ name: S.code + '_features.csv', mime: 'text/csv', blob: new Blob([featCsv()], { type: 'text/csv' }) });
  }
  if (WANT_VIDEO && R.blob && R.blob.size) items.push({ name: S.code + '_video.' + ext, mime, blob: R.blob });
  if (!items.length) { $('upMsg').textContent = t('upNone'); return; }
  const msg = $('upMsg'); msg.className = 'small';
  $('btnSend').hidden = true; $('btnRetry').hidden = true; $('dlRow').hidden = true;
  if (DEMO) { showDownloads(items); msg.textContent = t('upDemoMsg'); return; }
  R.upload.state = 'running';
  try {
    for (const it of items) {
      if (R.sent[it.name]) continue;
      await uploadBlob(it.blob, it.name, it.mime, f => {
        $('upBar').style.width = Math.round(100 * f) + '%';
        msg.textContent = t('uploading', { n: it.name.replace(S.code + '_', ''), p: Math.round(100 * f) });
      });
      R.sent[it.name] = true;
    }
    R.upload.state = 'done'; $('upBar').style.width = '100%';
    msg.textContent = t('upDone', { code: S.code }); msg.className = 'small ok';
    await idbClear();
  } catch (e) {
    R.upload.state = 'idle';
    msg.textContent = t('upFail');
    $('btnRetry').hidden = false; showDownloads(items);
  }
}
async function recoverCheck() {
  try {
    const meta = await idbMetaGet(); const ch = await idbAll();
    if (meta && ch.length) { R.recover = { meta, ch }; $('recoverBar').hidden = false; }
  } catch (e) {}
}
function recoverSend() {
  const { meta, ch } = R.recover;
  S.code = meta.code; S.invite = meta.invite || ''; R.mime = meta.mime || '';
  R.blob = new Blob(ch, { type: (R.mime || 'video/webm').split(';')[0] });
  S.recovered = true; $('recoverBar').hidden = true;
  show('s-end'); renderEnd(); $('btnSend').disabled = false; $('upMsg').textContent = '';
}

/* ---------- Wiring ---------- */
function updateStart() {
  const all = [...document.querySelectorAll('.chk')].every(c => c.checked) && $('consentChk').checked;
  const lmOk = MODE !== 'features' || R.lmState === 'ready';
  const inviteOk = DEMO || (S.invite && S.invite.length >= 4);
  $('btnStart').disabled = !(all && R.ready && lmOk && inviteOk);
}
function init() {
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  S.code = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
  buildEyes(); setFace('neutral', 0, 0); idleLoop();
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; S.voiceTouched = false; applyLang(); }));
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshVoice;
  $('btnToSetup').onclick = () => show('s-setup');
  document.querySelectorAll('.chk').forEach(c => c.addEventListener('change', updateStart));
  $('consentChk').addEventListener('change', updateStart);
  $('voiceChk').addEventListener('change', () => { S.voiceTouched = true; });
  $('btnStart').onclick = () => {
    S.name = $('robotName').value.trim() || 'Buddy';
    S.voiceOn = $('voiceChk').checked && S.voiceOk;
    ac(); mainFlow();
  };
  $('btnAsk').addEventListener('click', e => { e.currentTarget.blur(); askRobot(); });
  $('btnSkip').addEventListener('click', e => { e.currentTarget.blur(); skipCard(); });
  $('pzCheck').onclick = checkPuzzle;
  $('pzSkip').onclick = () => { logEv('puzzle_skip', S.pz ? S.pz.type : ''); newPuzzle(); };
  $('pzIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkPuzzle(); } });
  $('btnAbort').onclick = () => { $('confirm').hidden = false; $('abortNo').focus(); };
  $('abortNo').onclick = () => { $('confirm').hidden = true; };
  $('abortYes').onclick = abortSession;
  document.addEventListener('keydown', e => {
    if (S.screen !== 's-block' || !$('confirm').hidden) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space') { if (tag === 'button' && e.target.id !== 'btnAsk' && e.target.id !== 'btnSkip') return; e.preventDefault(); askRobot(); }
    else if (e.key === 's' || e.key === 'S') { skipCard(); }
  });
  $('enjoyBtns').onclick = e => {
    const x = e.target.closest('button'); if (!x) return;
    S.enjoy = x.dataset.v;
    $('enjoyBtns').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === x)));
    logEv('enjoyment', S.enjoy);
    if (R.upload.state !== 'running' && R.upload.state !== 'done') { $('btnSend').disabled = false; if (!$('upMsg').className.includes('ok')) $('upMsg').textContent = ''; }
  };
  $('btnCopy').onclick = async () => {
    const txt = csvText(), msg = $('copyMsg');
    try { await navigator.clipboard.writeText(txt); msg.textContent = t('copied'); return; } catch (e) {}
    try { $('logOut').select(); if (document.execCommand('copy')) { msg.textContent = t('copied'); return; } } catch (e) {}
    msg.textContent = t('copyFail');
  };
  $('btnDl').onclick = () => {
    try {
      const u = URL.createObjectURL(new Blob([csvText()], { type: 'text/csv' }));
      const a = document.createElement('a'); a.href = u; a.download = 'sesi-' + S.code + '.csv';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
    } catch (e) {}
    $('copyMsg').textContent = t('copyFail');
  };
  S.invite = '';
  $('inviteWrap').hidden = DEMO;
  $('camBtn').onclick = enableCamera;
  $('inviteIn').addEventListener('input', () => { S.invite = $('inviteIn').value.trim(); updateStart(); });
  $('btnSend').onclick = sendAll;
  $('btnRetry').onclick = sendAll;
  $('btnRecover').onclick = recoverSend;
  window.addEventListener('beforeunload', e => { if (R.upload.state === 'running' || R.recording) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (R.recording) logEv(document.hidden ? 'tab_hidden' : 'tab_visible'); });
  applyLang();
  show('s-intro');
  recoverCheck();
}
init();
})();
</script>
