<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesi Robot Meja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DotGothic16&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column; the LED robot head is the single bold element, everything else stays quiet. */
:root{
  --bg:#eef1ee; --surface:#fbfcfb; --ink:#17211e; --muted:#58675f; --line:#d3dbd6;
  --accent:#0e6b5c; --accent-ink:#ffffff; --warn:#a15c00;
  --plate:#11171a; --led:#ffb547; --led-dim:#2b2415;
  --ring-idle:#3a4a50; --ring-listen:#5cc8ff; --ring-think:#ffb547; --ring-speak:#5fe3a1;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-dot:'DotGothic16',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172120; --ink:#e6eeea; --muted:#9db0a8; --line:#263330;
    --accent:#4fd1b5; --accent-ink:#04231c; --warn:#f0b35a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --ink:#e6eeea; --muted:#9db0a8; --line:#263330;
  --accent:#4fd1b5; --accent-ink:#04231c; --warn:#f0b35a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font-b)}
.app{max-width:860px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font:700 15px var(--font-d);letter-spacing:.03em;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:600 13px var(--font-b);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;line-height:1.14;margin:0 0 .5em}
h1{font-size:clamp(28px,5.4vw,42px)}
h2{font-size:26px}
h3{font-size:18px}
p{margin:0 0 .8em}
ul,ol{margin:0 0 .8em;padding-left:1.2em}
li{margin:.2em 0}
.lead{color:var(--muted);max-width:62ch;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.kicker{font:600 13px var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:18px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px;margin-bottom:14px}
.btn{font:600 16px var(--font-b);padding:12px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.choice[aria-pressed="true"],.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:500 14px var(--font-b);padding:8px 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{font:500 17px var(--font-b);padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-right:10px;vertical-align:-4px}
.checks{list-style:none;padding:0;margin:0}
.checks li{margin:.55em 0}
.checks label,.consent{cursor:pointer;display:block}
.consent{margin:16px 0}
.field label{font-weight:600}
.field input[type=text]{width:100%;margin-top:8px}
.code{font-size:30px;letter-spacing:.12em;margin:4px 0}
.dot{font-family:var(--font-dot);font-variant-numeric:tabular-nums}
.scale{display:flex;gap:8px;margin:10px 0 4px}
.scale button{flex:1;font:600 17px var(--font-b);padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.scalelabels{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;gap:12px}
.big{font:700 clamp(26px,5vw,38px)/1.2 var(--font-d);text-align:center;margin:18px 0 8px;text-wrap:balance}

/* stage: HUD + robot */
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hud span:first-child{font:600 14px var(--font-b);color:var(--muted)}
.hud .dot{font-size:30px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.robot{width:min(320px,100%);margin:6px auto 0}
.robot svg{display:block;width:100%;height:auto}
.caption{min-height:3.1em;text-align:center;margin:10px auto 12px;max-width:46ch;font-weight:500}
@media (min-width:760px){.stack.two{grid-template-columns:1fr 1fr;align-items:start}}
.caption.idle{color:var(--muted);font-weight:400}
.px{fill:var(--led-dim)}
.px.on{fill:var(--led)}
.ring{stroke:var(--ring-idle);stroke-width:6;fill:none;transition:stroke .25s}
svg[data-ring="listen"] .ring{stroke:var(--ring-listen);animation:pulse 1.1s ease-in-out infinite}
svg[data-ring="speak"] .ring{stroke:var(--ring-speak);animation:pulse 1.6s ease-in-out infinite}
svg[data-ring="think"] .ring{stroke:var(--ring-think);stroke-dasharray:30 70;animation:chase 1.3s linear infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes chase{to{stroke-dashoffset:-100}}

/* block panels */
.say{font-size:21px;margin-bottom:.5em}
.pzq{font-size:34px;letter-spacing:.14em;margin:6px 0 12px}
.pzq.seq{letter-spacing:.06em}
#pzIn{flex:1 1 160px}
.banner{border-left:5px solid var(--warn);background:var(--surface);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-weight:600}
.ok{color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px;z-index:10}
.overlay .card{max-width:380px}
#pv{position:relative;max-width:360px;margin:12px 0}
#camPreview{display:block;width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}
#pv::after{content:'';position:absolute;left:32%;right:32%;top:10%;bottom:16%;border:3px dashed var(--warn);border-radius:50%;pointer-events:none}
#pv.good::after{border-style:solid;border-color:var(--accent)}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guide svg{display:block;width:100%;height:auto}
.guide figure{margin:0}
#review{max-height:220px;overflow:auto}
.ex{margin:.2em 0 .8em;padding-left:1.1em}
.ex li{font-weight:600;margin:.3em 0}
@media (max-width:600px){.robot{width:200px}#pv::after{left:22%;right:22%}}
.checks.small li{margin:.3em 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" data-i="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <main>
    <!-- Stage: robot face + HUD, shown during calibration and blocks -->
    <div id="stage" hidden>
      <div class="hud"><span id="hudLabel"></span><span id="hudTime" class="dot"></span></div>
      <div class="bar"><i id="hudBar"></i></div>
      <div class="robot">
        <svg id="robot" viewBox="0 0 360 230" data-ring="idle" role="img" aria-label="Robot">
          <defs>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect x="6" y="6" width="348" height="218" rx="56" fill="var(--plate)"/>
          <rect class="ring" x="18" y="18" width="324" height="194" rx="46" pathLength="100"/>
          <g id="eyeL" transform="translate(60 67)" filter="url(#glow)"></g>
          <g id="eyeR" transform="translate(204 67)" filter="url(#glow)"></g>
        </svg>
      </div>
      <p id="caption" class="caption idle" aria-live="polite"></p>
      <p id="heard" class="small muted" style="text-align:center;min-height:1.4em;margin:0" aria-live="polite"></p>
      <p id="fbHint" class="small" style="text-align:center;margin:4px 0 0" hidden data-i="fbHint"></p>
    </div>

    <section id="s-intro" class="screen">
      <div id="recoverBar" class="banner" hidden><span data-i="recoverText"></span> <button type="button" class="btn" id="btnRecover" data-i="btnRecover"></button> <button type="button" class="btn ghost" id="btnForget" data-i="btnForget"></button></div>
      <h1 data-i="introTitle"></h1>
      <p class="lead" data-i="introLead"></p>
      <div class="grid3">
        <div class="card"><h3 data-i="sentTitle"></h3>
          <ul><li data-i="sent1"></li><li data-i="sent2"></li><li data-i="sent3"></li></ul><p><strong data-i="sentNot"></strong></p></div>
        <div class="card"><h3 data-i="privTitle"></h3>
          <ul><li data-i="priv1"></li><li data-i="priv2"></li><li data-i="priv3"></li></ul></div>
        <div class="card"><h3 data-i="doTitle"></h3>
          <ul><li data-i="do1"></li><li data-i="do2"></li><li data-i="do3"></li></ul>
          <h3 data-i="dontTitle"></h3>
          <ul><li data-i="dont1"></li><li data-i="dont2"></li><li data-i="dont3"></li></ul></div>
      </div>
      <p id="contactLine" class="muted small" hidden></p>
      <p><button type="button" class="btn primary" id="btnToSetup" data-i="btnToSetup"></button></p>
    </section>

    <section id="s-setup" class="screen" hidden>
      <h2 data-i="setupTitle"></h2>
      <div class="card" style="margin-bottom:14px">
        <h3 data-i="guideTitle"></h3>
        <div class="guide">
          <figure><div id="guideGood" class="ok"></div><figcaption class="small">✓ <span data-i="guideGood"></span></figcaption></figure>
          <figure><div id="guideBad" class="muted"></div><figcaption class="small">✕ <span data-i="guideBad"></span></figcaption></figure>
        </div>
      </div>
      <div class="card">
        <ul class="checks">
          <li><label><input type="checkbox" class="chk"><span id="chkDevice"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk2"></span></label></li>
          <li><label><input type="checkbox" class="chk"><span data-i="chk3"></span></label></li>
        </ul>
      </div>
      <div class="grid3">
        <div class="card field">
          <label for="robotName" data-i="nameLabel"></label>
          <input type="text" id="robotName" maxlength="14" autocomplete="off">
        </div>
        <div class="card field">
          <label><input type="checkbox" id="voiceChk"><span data-i="voiceLabel"></span></label>
          <p id="voiceNote" class="muted small"></p>
        </div>
        <div class="card field">
          <div class="muted small" data-i="codeLabel"></div>
          <div id="sessCode" class="dot code"></div>
          <p class="small muted" data-i="codeHelp"></p>
        </div>
      </div>
      <div class="grid3" id="inviteWrap">
        <div class="card field">
          <label for="inviteIn" data-i="inviteLabel"></label>
          <input type="text" id="inviteIn" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>
      </div>
      <div class="card" id="camCard" style="margin:14px 0">
        <h3 data-i="camTitle"></h3>
        <p class="small muted" data-i="camHelp"></p>
        <button type="button" class="btn" id="camBtn" data-i="camBtn"></button>
        <div id="camBox" hidden>
          <div id="pv"><video id="camPreview" playsinline muted></video></div>
          <ul class="checks small" aria-live="polite"><li id="chkCam"></li><li id="chkLight"></li><li id="chkFace"></li><li id="chkMode"></li><li id="chkStt"></li></ul>
        </div>
        <p id="camMsg" class="small" aria-live="polite"></p>
      </div>
      <label class="consent"><input type="checkbox" id="consentChk"><span data-i="consentLabel"></span>
        <a id="consentLink" href="#" target="_blank" rel="noopener" hidden data-i="consentLink"></a></label>
      <p><button type="button" class="btn primary" id="btnStart" disabled data-i="btnStart"></button></p>
    </section>

    <section id="s-calib" class="screen" hidden>
      <p id="calibText" class="big" aria-live="assertive"></p>
      <p id="calibHint" class="muted" style="text-align:center;min-height:1.5em" aria-live="polite"></p>
      <p class="muted" style="text-align:center" data-i="calibTip"></p>
    </section>

    <section id="s-blockintro" class="screen" hidden>
      <p class="kicker" id="biKicker"></p>
      <h2 id="biTitle"></h2>
      <p class="lead" id="biText"></p>
      <p class="small muted" data-i="exTitle"></p>
      <ul id="biEx" class="ex"></ul>
      <p><button type="button" class="btn primary" id="btnBlockStart" data-i="btnBlockStart"></button></p>
    </section>

    <section id="s-block" class="screen" hidden>
      <div id="breakBanner" class="banner" role="status" hidden></div>
      <div class="stack two">
        <div class="card">
          <p class="say"><strong id="askTitle"></strong></p>
          <ul id="examples" class="ex"></ul>
          <p class="small muted" id="topics" style="margin:0"></p>
        </div>
        <div id="caseWrap" class="card">
          <div class="kicker" id="caseKicker"></div>
          <p id="caseStory"></p>
          <div id="caseAccuse">
            <p class="small muted" data-i="caseAccuse"></p>
            <div class="row" id="suspects"></div>
          </div>
          <p id="caseMsg" class="small ok" style="margin:10px 0 0" aria-live="polite"></p>
        </div>
        <div id="freeWrap" class="card" hidden>
          <h3 id="freeH"></h3><p style="margin:0" id="freeP"></p>
        </div>
      </div>
    </section>

    <section id="s-rate" class="screen" hidden>
      <h2 data-i="rateTitle"></h2>
      <div class="stack">
        <div class="card">
          <p data-i="q1"></p>
          <div class="scale" id="arousalBtns" role="group" aria-label="1-5">
            <button type="button" data-v="1" aria-pressed="false">1</button>
            <button type="button" data-v="2" aria-pressed="false">2</button>
            <button type="button" data-v="3" aria-pressed="false">3</button>
            <button type="button" data-v="4" aria-pressed="false">4</button>
            <button type="button" data-v="5" aria-pressed="false">5</button>
          </div>
          <div class="scalelabels"><span data-i="q1lo"></span><span data-i="q1hi"></span></div>
        </div>
        <div class="card">
          <p data-i="q2"></p>
          <div class="row" id="botherBtns" role="group">
            <button type="button" class="btn choice" data-v="no" aria-pressed="false" data-i="q2no"></button>
            <button type="button" class="btn choice" data-v="yes" aria-pressed="false" data-i="q2yes"></button>
          </div>
        </div>
      </div>
      <p><button type="button" id="btnRateNext" class="btn primary" disabled></button></p>
    </section>

    <section id="s-end" class="screen" hidden>
      <h1 data-i="endTitle"></h1>
      <div class="stack">
        <div class="card">
          <p data-i="enjoy"></p>
          <div class="scale" id="enjoyBtns" role="group" aria-label="1-5">
            <button type="button" data-v="1" aria-pressed="false">1</button>
            <button type="button" data-v="2" aria-pressed="false">2</button>
            <button type="button" data-v="3" aria-pressed="false">3</button>
            <button type="button" data-v="4" aria-pressed="false">4</button>
            <button type="button" data-v="5" aria-pressed="false">5</button>
          </div>
          <div class="scalelabels"><span data-i="enjoyLo"></span><span data-i="enjoyHi"></span></div>
        </div>
        <div class="card" id="traitCard">
          <p data-i="traitIntro"></p>
          <div data-q="ext1"><p class="small" style="margin:12px 0 0" data-i="trait1"></p><div class="scale" role="group" aria-label="1-5"><button type="button" data-v="1" aria-pressed="false">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="false">3</button><button type="button" data-v="4" aria-pressed="false">4</button><button type="button" data-v="5" aria-pressed="false">5</button></div></div>
          <div data-q="ext2r"><p class="small" style="margin:12px 0 0" data-i="trait2"></p><div class="scale" role="group" aria-label="1-5"><button type="button" data-v="1" aria-pressed="false">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="false">3</button><button type="button" data-v="4" aria-pressed="false">4</button><button type="button" data-v="5" aria-pressed="false">5</button></div></div>
          <div data-q="va"><p class="small" style="margin:12px 0 0" data-i="trait3"></p><div class="scale" role="group" aria-label="1-5"><button type="button" data-v="1" aria-pressed="false">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="false">3</button><button type="button" data-v="4" aria-pressed="false">4</button><button type="button" data-v="5" aria-pressed="false">5</button></div></div>
          <div class="scalelabels"><span data-i="traitLo"></span><span data-i="traitHi"></span></div>
        </div>
        <div class="card">
          <h3 data-i="reviewTitle"></h3>
          <p class="small muted" data-i="reviewHelp"></p>
          <ul id="review" class="small"></ul>
          <button type="button" class="btn ghost" id="btnDelAll" data-i="btnDelAll"></button>
        </div>
        <div class="card" id="upCard">
          <h3 data-i="uploadTitle"></h3>
          <p id="upInfo" class="small muted"></p>
          <div class="bar"><i id="upBar"></i></div>
          <p id="upMsg" class="small" aria-live="polite"></p>
          <div class="row">
            <button type="button" id="btnSend" class="btn primary" disabled data-i="btnSend"></button>
            <button type="button" id="btnRetry" class="btn" hidden data-i="btnRetry"></button>
          </div>
          <div id="dlRow" class="row" style="margin-top:10px" hidden></div>
          <p style="margin:10px 0 0"><button type="button" id="btnDiscard" class="link" data-i="btnDiscard"></button></p>
        </div>
      </div>
    </section>

    <p style="text-align:center"><button type="button" id="btnAbort" class="link" hidden data-i="btnAbort"></button></p>
  </main>
</div>

<div id="confirm" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="confirmQ">
    <p id="confirmQ" style="font-weight:600" data-i="abortQ"></p>
    <div class="row">
      <button type="button" id="abortYes" class="btn primary" data-i="abortYes"></button>
      <button type="button" id="abortNo" class="btn" data-i="abortNo"></button>
    </div>
  </div>
</div>

<video id="camFeed" playsinline muted aria-hidden="true" style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<script>
(() => {
'use strict';

/* ---------- Settings (edit here) ---------- */
const CONFIG = {
  CONSENT_URL: '',     // link to your consent form (optional)
  RESEARCHER: '',      // researcher name (optional)
  CONTACT: '',         // contact shown on the first screen (optional)
  BLOCK_SECONDS: { A: 180, B: 180, C: 180 },
  CALIB_SECONDS: 5,                        // seconds each calibration pose must be HELD
  CALIB_FRONT_DEG: { yaw: 12, pitch: 15 }, // look phase: head within this many degrees of the camera axis
  CALIB_AWAY_DEG: { yaw: 15, pitch: 12 },  // away phase: at least this far from the look pose
  CALIB_RELAX_MS: 6000,                    // pose not reached for this long: loosen the test
  CALIB_MAX_WAIT_MS: 20000,                // still not reached: plain timer so nobody gets stuck
  WARMUP: true,
  WARMUP_MAX_MS: 60000,
  HIDE_CLOCK: true,        // the exact time left is something to ask the robot
  END_PAUSE_MS: 1300,      // silence after the last words before a sentence counts as finished
  CORRECT_MS: 8000,        // after an answer, "wrong, it should be ..." is taken as a correction for this long
  POS_WARN_MS: 3000,       // the robot warns when the face is lost, too far, too close or at the edge this long
  POS_COOLDOWN_MS: 20000,  // and then waits at least this long before warning again
  GOAL_CHECKIN: true,      // the robot asks for a goal at the start of each block and checks back near the end
  ROBOT_OFFERS: true,      // the robot offers to listen if it was never addressed in a block
  ASK_WINDOW_MS: 25000,    // how long a robot question stays open
  LISTEN_MAX_MS: 60000,
  LISTEN_SILENCE_MS: 6000,
  BACKCHANNEL_MIN_MS: 1200,
  PRACTICE_MS: 20000,
  GAZE_FOLLOW: true,

const L3 = (id, en, ru) => ({ id, en, ru });
const SR_LANG = L3('id-ID', 'en-US', 'ru-RU');
const NAME_DEF = L3('Budi', 'Buddy', 'Бадди');
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
// Edit distance, because recognisers mishear a name by a letter or two.
function dist(a, b) {
  let row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const next = [i];
    for (let j = 1; j <= b.length; j++) next[j] = Math.min(next[j - 1] + 1, row[j] + 1, row[j - 1] + (a[i - 1] !== b[j - 1]));
    row = next;
  }
  return row[b.length];
}
// The text without the name if the robot was called, otherwise null. The first letter must match.
function afterName(text, name) {
  const words = norm(text).split(' '), n = norm(name).replace(/ /g, ''), slack = n.length <= 4 ? 1 : 2;
  const i = words.findIndex(w => w && w[0] === n[0] && dist(w, n) <= slack);
  return i < 0 ? null : words.filter((_, k) => k !== i).join(' ');
}

  if (S.listen) { listenHeard(called[0] ?? text, dur); return; }
  $('heard').textContent = t('heardLine', { x: text });
  setRing('idle');
  if (S.ask) { answerAsk(alts, called); return; }
  if (called.length) { closeFeedback('next'); respond(called, text); return; }
  if (S.fb) {
    const s = alts.map(norm);
    if (s.some(x => NOTME.test(x))) feedbackSaid('notme'); else if (s.some(x => CORRECT.test(x))) feedbackSaid('corrected');
  }
}

/* ---------- Robot reply and spoken feedback ---------- */
function inBlock() { return !S.aborted && S.screen === 's-block'; }
function robotIdle() { setRing('idle'); setFace('neutral', gaze.dx, gaze.dy); caption(t('stIdle'), true); }
async function robotSay(text, emo) {
  sttPause();
  setRing('speak'); setFace(emo, 0, 0); caption(text, false); CHIRP[emo] && CHIRP[emo]();
  await Promise.all([speak(text), sleep(Math.min(7000, Math.max(2200, text.length * 55)))]);
  sttResume();
}
// After an answer, saying "wrong, it should be ..." (no name needed) is logged as a correction; the
// words themselves are in the heard row. Silence means no complaint.
function openFeedback(k) {
  closeFeedback('none');
  $('fbHint').hidden = false;
  S.fb = { k, t: setTimeout(() => closeFeedback('none'), CONFIG.CORRECT_MS) };
}
function closeFeedback(v) {
  if (!S.fb) return;
  clearTimeout(S.fb.t); logEv('feedback', 'k=' + S.fb.k + ';v=' + v);
  S.fb = null; $('fbHint').hidden = true;
}
async function feedbackSaid(v) {
  closeFeedback(v);
  S.busy = true;
  await robotSay(t(v === 'notme' ? 'fbSorry' : 'fbThanks'), 'happy');
  S.busy = false;
  if (inBlock()) setRing('idle');
}
async function deliver(intent, makeText, feedback) {
  closeFeedback('next');
  S.busy = true; logEv('reply_request', intent);
  setRing('think'); setFace('thinking'); caption(t('stThink'), true);
  await sleep(500);
  if (!inBlock()) { S.busy = false; return; }
  logEv('reply_start', intent);
  await robotSay(makeText(), 'happy');
  logEv('reply_end', intent);
  S.busy = false;
  if (!inBlock()) return;
  setRing('idle'); setFace('neutral', gaze.dx, gaze.dy); S.replies++;   // the answer stays readable
  if (feedback) openFeedback(intent);
  if (S.block === 'W' && ++S.warmStep === 2) setTimeout(() => S.block === 'W' && S.blockResolve && S.blockResolve(), 4000);
}
function respond(called, text) {
  const [intent, which] = routeAlts(called, S.block, curCase());
  logEv('intent', intent);
  if (intent === 'listen' || intent === 'practice') startListen(intent);
  else deliver(intent, () => replyFor(intent, which || text), true);
}

/* ---------- Listening sessions: listener mode and speaking practice ---------- */
async function startListen(mode) {
  closeFeedback('next');
  const practice = mode === 'practice', topic = practice ? rot('topic', TOPICS[S.lang]) : '';
  S.busy = true; logEv('reply_request', mode);
  await robotSay(practice ? t('practiceIntro', { topic, total: Math.round(CONFIG.PRACTICE_MS / 1000) }) : t('listenIntro'), 'curious');
  S.busy = false;
  if (!inBlock()) return;
  S.listen = { mode, t0: performance.now(), voiced: 0, n: 0, lastBc: 0, quiet: null,
    max: setTimeout(() => endListen(practice ? 'time' : 'timeout'), practice ? CONFIG.PRACTICE_MS : CONFIG.LISTEN_MAX_MS),
    tick: practice ? setInterval(listenCaption, 500) : null };
  logEv(mode + '_start');
  setRing('listen'); listenCaption();
}
function listenCaption() {
  const L = S.listen; if (!L) return;
  if (L.mode === 'practice') caption(t('practiceOn', { s: Math.max(0, Math.ceil((CONFIG.PRACTICE_MS - (performance.now() - L.t0)) / 1000)) }), true);
  else caption(t('listenOn'), true);
}
function listenHeard(text, dur) {
  const L = S.listen;
  L.voiced += dur; L.n++;
  if (L.mode === 'practice') return;
  if (DONE.test(norm(text)) && norm(text).split(' ').length <= 3) { endListen('done'); return; }
  if (dur >= CONFIG.BACKCHANNEL_MIN_MS && performance.now() - L.lastBc > 2500) backchannel();
  clearTimeout(L.quiet); L.quiet = setTimeout(() => endListen('silence'), CONFIG.LISTEN_SILENCE_MS);
}
async function backchannel() {
  const L = S.listen; if (!L) return;
  L.lastBc = performance.now(); logEv('backchannel');
  sweep(520, 470, .12, 0, .07, 'sine');
  caption(rot('bc', BACKCH[S.lang]), false);
  setFace('neutral', gaze.dx, gaze.dy + 1); await sleep(170);
  if (S.listen === L) setFace('neutral', gaze.dx, gaze.dy);
  await sleep(1100);
  if (S.listen === L) listenCaption();
}
// Clears a running listening session and logs it. Returns it, or null if there was none.
function abortListen(why) {
  const L = S.listen; if (!L) return null;
  S.listen = null; clearTimeout(L.max); clearTimeout(L.quiet); clearInterval(L.tick);
  if (STT.segT != null) L.voiced += Math.round(performance.now() - STT.segT);   // still talking when it ended
  logEv(L.mode + '_end', 'why=' + why + ';voiced_ms=' + L.voiced + ';segments=' + L.n);
  return L;
}
function endListen(why) {
  const L = abortListen(why);
  if (!L || !inBlock()) return;
  deliver(L.mode + '_done', () => L.mode === 'practice'
    ? t('practiceDone', { s: Math.round(L.voiced / 1000), total: Math.round(CONFIG.PRACTICE_MS / 1000) })
    : t('listenEnd'), false);
}

/* ---------- The robot speaks first ---------- */
// Logged as robot_ask, and any answer as reply_prompted, so analysis can keep these apart from
// addresses the participant started. Never while the participant is talking.
const robotCanSpeak = () => !S.busy && !S.listen && !userTalking() && $('breakBanner').hidden;
async function robotAsk(kind, block, tries) {
  if (!inBlock() || S.block !== block) return;
  if (kind === 'offer' ? (!CONFIG.ROBOT_OFFERS || S.replies > 0 || S.ask) : !CONFIG.GOAL_CHECKIN) return;
  if (kind === 'checkout' && !S.checkedIn) return;
  if (!robotCanSpeak()) { if ((tries || 0) < 4) setTimeout(() => robotAsk(kind, block, (tries || 0) + 1), 3000); return; }
  closeFeedback('next');
  S.busy = true; logEv('robot_ask', kind);
  await robotSay(t(kind === 'offer' ? 'offerListen' : kind + 'Q'), 'curious');
  S.busy = false;
  if (!inBlock() || S.block !== block) return;
  S.ask = { kind, until: performance.now() + CONFIG.ASK_WINDOW_MS };
  setRing('listen');
}
function answerAsk(alts, called) {
  const kind = S.ask.kind;
  if (called.length && routeAlts(called, S.block, curCase())[0] !== 'free') { S.ask = null; respond(called, alts[0]); return; }   // a real request wins
  if (kind === 'offer' && !alts.some(a => YES.test(norm(a)))) return;
  S.ask = null; logEv('reply_prompted', kind);
  if (kind === 'offer') { startListen('listen'); return; }
  if (kind === 'checkin') S.checkedIn = true;
  deliver(kind, () => t(kind + 'R'), false);
}
function expireAsk() {
  if (!S.ask || S.busy || performance.now() < S.ask.until) return;
  logEv('ask_expired', S.ask.kind); S.ask = null; robotIdle();
}
// Warns when the face is lost, too far, too close or at the edge for POS_WARN_MS, at most once per
// POS_COOLDOWN_MS. Turning the head away is normal and does not count.
function posState() {
  if (!R.pose || performance.now() - R.pose.t > 1500) return 'ok';   // tracker not running: nothing to judge
  if (R.pose.face !== 1 || !R.face) return 'none';
  const [far, near] = DEVICE === 'phone' ? [0.28, 0.8] : [0.16, 0.6];
  if (R.face.w < far) return 'far';
  if (R.face.w > near) return 'near';
  if (R.face.cx < 0.15 || R.face.cx > 0.85 || R.face.cy < 0.15 || R.face.cy > 0.85) return 'edge';
  return 'ok';
}
function checkPos() {
  if (S.screen !== 's-block' || !$('breakBanner').hidden) { S.posBad = null; return; }
  const st = posState(), now = performance.now();
  if (st === 'ok') { if (S.posBad && S.posBad.warned) logEv('pos_ok'); S.posBad = null; return; }
  if (!S.posBad || S.posBad.st !== st) S.posBad = { st, since: now, warned: !!(S.posBad && S.posBad.warned) };
  if (now - S.posBad.since < CONFIG.POS_WARN_MS || now - S.posWarnT < CONFIG.POS_COOLDOWN_MS || !robotCanSpeak()) return;
  S.posWarnT = now; S.posBad.warned = true; logEv('pos_warn', st);
  S.busy = true;
  robotSay(t('pos_' + st), 'curious').then(() => { S.busy = false; if (inBlock()) setRing('idle'); });
}

/* ---------- Block panels and cases ---------- */
function renderBlock() {
  const b = S.block, c = curCase(), det = detective(b);
  $('askTitle').textContent = t('askTitle', { n: S.name });
  renderExamples($('examples'), b);
  $('topics').textContent = c ? t('topicLabel') + ' ' + c.facts.map(f => (f.who || f.name)[S.lang]).join(' · ') : '';
  $('caseWrap').hidden = !det; $('freeWrap').hidden = det;
  if (det) {
    $('caseKicker').textContent = c ? t('caseNo', { i: S.caseIdx + 1, total: CASES.length }) : '';
    $('caseStory').textContent = c ? c.story[S.lang] : t('caseAll');
    $('caseAccuse').hidden = !c;
    const row = $('suspects'); row.textContent = '';
    if (c) for (const f of c.facts.filter(f => f.who)) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn'; btn.textContent = f.who[S.lang]; btn.disabled = S.caseDone;
      btn.onclick = () => accuse(f.id);
      row.appendChild(btn);
    }
    $('caseMsg').textContent = S.caseDone && c ? c.solved[S.lang] : '';
  } else {
    $('freeH').textContent = t(b === 'W' ? 'warmTitle' : 'freeTitle');
    $('freeP').textContent = t(b === 'W' ? 'warmText' : 'freeText', { n: S.name });
  }
}
function accuse(k) {
  const c = curCase(); if (!c || S.caseDone) return;
  const right = k === c.culprit;
  logEv('case_accuse', c.id + ';' + k + ';right=' + (right ? 1 : 0));
  if (!right) { $('caseMsg').textContent = t('caseWrong', { n: S.name }); return; }
  S.solved++; S.caseDone = true; renderBlock();
  setTimeout(() => { if (S.caseDone && curCase() === c) nextCase('solved'); }, 4000);
}
// The next unseen case, in a fixed order so every participant meets the same cases.
function nextCase(why) {
  const c = curCase(); if (!c) return;
  logEv('case_end', c.id + ';' + why);
  S.caseIdx++; S.caseDone = false;
  const n = curCase();
  if (n) { logEv('case_start', n.id); $('heard').textContent = t('caseNext'); }
  renderBlock();
}

/* ---------- Session flow ---------- */
function waitFor(setup) { return new Promise(res => { S.cancel = res; setup(res); }); }

// Calibration. Each phase shows an instruction and its countdown only runs while the head pose
// matches it, as measured by the face tracker ("look": facing the robot and steady; "away": turned
// away from the pose held in the look phase, or face out of view). Nobody can get stuck: after
// CALIB_RELAX_MS the test is loosened, and after CALIB_MAX_WAIT_MS it becomes a plain timer.
// Without a working face tracker it is a plain timer from the start, as in page version 2.
async function calibration() {
  show('s-calib'); setRing('idle'); setFace('neutral', 0, 0); caption(t('stIdle'), true);
  hud(t('calibHud'), '', 0);
  $('calibText').textContent = t('beepNote'); $('calibHint').textContent = '';
  await sleep(1700);
  const fresh = () => R.lmState === 'ready' && R.pose && performance.now() - R.pose.t < 700;
  const median = a => { const b = a.slice().sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };
  const recent = [];   // last few poses with a face, to tell a steady head from one that is still turning
  const steady = () => {
    if (recent.length < 5) return false;
    const ys = recent.map(p => p.yaw), ps = recent.map(p => p.pitch);
    return Math.max(...ys) - Math.min(...ys) < 6 && Math.max(...ps) - Math.min(...ps) < 6;
  };
  let ref = null;      // pose held in the look phase
  const tests = {
    look: (p, relaxed) => p.face === 1 && steady() &&
      (relaxed || (Math.abs(p.yaw) <= CONFIG.CALIB_FRONT_DEG.yaw && Math.abs(p.pitch) <= CONFIG.CALIB_FRONT_DEG.pitch)),
    away: (p, relaxed) => {
      if (p.face !== 1) return true;   // turned so far that the face is lost
      if (!ref) return Math.abs(p.yaw) > 20 || Math.abs(p.pitch) > 15;
      const k = relaxed ? 0.6 : 1;
      return Math.abs(p.yaw - ref.yaw) >= k * CONFIG.CALIB_AWAY_DEG.yaw || Math.abs(p.pitch - ref.pitch) >= k * CONFIG.CALIB_AWAY_DEG.pitch;
    }
  };
  const phase = async name => {
    if (S.aborted) return;
    const ev = 'calib_' + name, need = CONFIG.CALIB_SECONDS * 1000;
    logEv(ev); $('calibText').textContent = t(name === 'look' ? 'calibLook' : 'calibAway');
    let held = 0, waited = 0, started = false, beeps = -1, last = performance.now(), seen = null;
    let mode = fresh() ? 'pose' : 'timer';
    const ys = [], ps = [];
    recent.length = 0;
    if (mode === 'timer') logEv(ev + '_timer', 'tracker=' + R.lmState);
    while (held < need && !S.aborted) {
      await sleep(100);
      const now = performance.now(), dt = Math.min(250, now - last); last = now;
      let ok = true;
      if (mode !== 'timer') {
        const p = fresh() ? R.pose : null;
        if (p && p !== seen) {
          if (p.face === 1) { recent.push(p); if (recent.length > 5) recent.shift(); } else recent.length = 0;
        }
        ok = !!p && tests[name](p, mode === 'relaxed');
        if (ok && p !== seen && p.face === 1) { ys.push(p.yaw); ps.push(p.pitch); }
        seen = p;
        if (!ok) {
          waited += dt;
          if (waited >= CONFIG.CALIB_MAX_WAIT_MS) { mode = 'timer'; ok = true; logEv(ev + '_timer', 'timeout'); }
          else if (mode === 'pose' && waited >= CONFIG.CALIB_RELAX_MS) { mode = 'relaxed'; logEv(ev + '_relaxed'); }
        }
      }
      if (ok) {
        if (!started) { started = true; logEv(ev + '_hold'); }
        held += dt;
      }
      $('calibHint').textContent = mode === 'timer' ? '' : t(ok ? 'calibHold' : (name === 'look' ? 'calibLookHint' : 'calibAwayHint'));
      hud(t('calibHud'), pad(Math.max(0, Math.ceil((need - held) / 1000))), Math.min(100, 100 * held / need));
      const sec = Math.floor(held / 1000);
      if (ok && sec !== beeps && held < need) { beeps = sec; sweep(800, 800, .05, 0, .06, 'sine'); }
    }
    if (S.aborted) return;
    const my = median(ys), mp = median(ps);
    if (name === 'look' && my != null) ref = { yaw: my, pitch: mp };
    if (name === 'look' && R.pose && R.pose.cx != null) R.gazeRef = { cx: R.pose.cx, cy: R.pose.cy };   // where the face is when looking at the robot
    logEv(ev + '_done', 'mode=' + mode + ';wait_ms=' + Math.round(waited) + ';n=' + ys.length + (my != null ? ';yaw=' + r2(my) + ';pitch=' + r2(mp) : ''));
  };
  await phase('look');
  await phase('away');
  $('calibHint').textContent = '';
  if (!S.aborted) logEv('calib_end');
}

function blockIntro(key) {
  return waitFor(res => {
    show('s-blockintro');
    $('biKicker').textContent = t('block' + key); $('biTitle').textContent = t('title' + key); $('biText').textContent = t('text' + key, { n: S.name }); renderExamples($('biEx'), key);
    $('btnBlockStart').onclick = () => res();
  });
}
function rate(key) {
  return waitFor(res => {
    show('s-rate');
    let a = null, b = null;
    const next = $('btnRateNext');
    next.textContent = key === 'C' ? t('btnFinish') : t('btnNext'); next.disabled = true;
    const mark = (group, v) => group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
    mark($('arousalBtns'), ''); mark($('botherBtns'), '');
    const upd = () => { next.disabled = a == null || b == null; };
    $('arousalBtns').onclick = e => { const x = e.target.closest('button'); if (!x) return; a = x.dataset.v; mark($('arousalBtns'), a); upd(); };
    $('botherBtns').onclick = e => { const x = e.target.closest('button'); if (!x) return; b = x.dataset.v; mark($('botherBtns'), b); upd(); };
    next.onclick = () => { logEv('rating', 'block=' + key + ';arousal=' + a + ';bothered=' + b); res(); };
  });
}

// The three optional trait answers are written to the events file once, when the data is sent.
function logTraits() {
  if (S.traitsLogged || S.recovered) return;
  const ks = Object.keys(S.traits); if (!ks.length) return;
  S.traitsLogged = true;
  logEv('traits', ks.map(k => k + '=' + S.traits[k]).join(';'));
}

function resetBlock(key) {
  S.block = key; S.replies = 0; S.busy = false; S.ask = null; S.checkedIn = false;
  show('s-block'); robotIdle(); $('breakBanner').hidden = true; $('heard').textContent = '';
}
// Two practice exchanges before block A, between warmup_start and warmup_end in the events file.
async function warmup() {
  if (S.aborted || !CONFIG.WARMUP) return;
  resetBlock('W'); S.warmStep = 0;
  hud(t('warmHud'), '', 0);
  logEv('warmup_start');
  renderBlock();
  const giveUp = setTimeout(() => { logEv('warmup_timeout'); S.blockResolve && S.blockResolve(); }, CONFIG.WARMUP_MAX_MS);
  await new Promise(res => { S.blockResolve = res; S.cancel = res; });
  clearTimeout(giveUp);
  closeFeedback('none');
  try { speechSynthesis.cancel(); } catch (e) {}
  if (!S.aborted) logEv('warmup_end');
}

async function runBlock(key) {
  await blockIntro(key);
  if (S.aborted) return;
  resetBlock(key);
  const dur = CONFIG.BLOCK_SECONDS[key] * 1000, start = performance.now();
  S.blockEnd = start + dur;
  logEv('block_start', key);
  if (curCase()) logEv('case_start', curCase().id);
  renderBlock();
  S.sched = [{ at: 1200, fn: () => robotAsk('checkin', key) }, { at: .86 * dur, fn: () => robotAsk('checkout', key) }];
  [.45, .68].forEach(f => S.sched.push({ at: f * dur, fn: () => robotAsk('offer', key) }));
  if (key === 'B') {
    [[.2, 'br1'], [.5, 'br2'], [.78, 'br3']].forEach(([f, id]) => S.sched.push({ at: f * dur, fn: () => {
      const bn = $('breakBanner'); bn.textContent = t(id); bn.hidden = false; chime(); logEv('break_prompt', id);
      setTimeout(() => { bn.hidden = true; logEv('break_end', id); }, CONFIG.BREAK_SECONDS * 1000);
    } }));
  }
  const tick = () => {
    const el = performance.now() - start;
    hud(t('block' + key) + ' · ' + t('title' + key), CONFIG.HIDE_CLOCK ? '' : pad(Math.max(0, Math.ceil((dur - el) / 1000))), Math.min(100, 100 * el / dur));
    S.sched.forEach(s => { if (!s.done && el >= s.at) { s.done = true; s.fn(); } });
    expireAsk();
    if (el >= dur) { clearInterval(S.tickT); S.blockResolve && S.blockResolve(); }
  };
  await new Promise(res => { S.blockResolve = res; S.cancel = res; S.tickT = setInterval(tick, 200); tick(); });
  clearInterval(S.tickT);
  abortListen(S.aborted ? 'abort' : 'block_end');
  closeFeedback('none');
  try { speechSynthesis.cancel(); } catch (e) {}
  S.busy = false; S.ask = null; $('breakBanner').hidden = true;
  if (!S.aborted) { logEv('block_end', key); chime(); }
  backup();
  if (!S.aborted && CONFIG.BLOCK_RATINGS) await rate(key);
}

async function mainFlow() {
  beginCapture();
  await calibration();
  await warmup();
  for (const k of ['A', 'B', 'C']) { if (S.aborted) break; await runBlock(k); }
  logEv(S.aborted ? 'session_abort' : 'session_end');
  stopCapture();
  backup();
  showEnd();
}

/* ---------- End screen: review, send, delete ---------- */
function renderEnd() {
  $('upInfo').textContent = t(DEMO ? 'upDemo' : 'upInfo', { code: S.code });
  if (R.upload.state === 'idle' && $('btnSend').disabled) $('upMsg').textContent = t('upRate');
  const list = $('review'); list.textContent = '';
  const said = S.log.filter(e => e.type === 'heard' && !e.detail.endsWith('|'));
  for (const e of said) {
    const li = document.createElement('li'), x = document.createElement('button');
    li.textContent = e.detail.slice(e.detail.indexOf('|') + 1) + ' ';
    x.type = 'button'; x.className = 'link'; x.textContent = '✕'; x.setAttribute('aria-label', t('btnForget'));
    x.onclick = () => { forget([e]); };
    li.appendChild(x); list.appendChild(li);
  }
  if (!said.length) { const li = document.createElement('li'); li.textContent = t('reviewNone'); list.appendChild(li); }
  $('btnDelAll').hidden = !said.length;
}
function forget(entries) {
  for (const e of entries) e.detail = e.detail.slice(0, e.detail.indexOf('|') + 1);
  backup(); renderEnd();
}
function showEnd() {
  clearInterval(S.tickT); show('s-end'); renderEnd();
}
function abortSession() {
  $('confirm').hidden = true;
  S.aborted = true;
  clearInterval(S.tickT);
  try { speechSynthesis.cancel(); } catch (e) {}
  if (S.cancel) S.cancel();
  if (S.blockResolve) S.blockResolve();
}

// Kept in this browser until sent or deleted, so a closed tab does not lose the session.
function backup() {
  if (S.recovered || !S.log.length) return;
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ code: S.code, invite: S.invite, device: DEVICE, events: csvText(), features: featCsv() })); } catch (e) {}
}
function forgetBackup() { try { localStorage.removeItem(BACKUP_KEY); } catch (e) {} }
function discardAll() {
  S.log = []; R.feat = []; S.recovered = null; forgetBackup();
  R.upload.state = 'done';
  $('review').textContent = ''; $('btnDelAll').hidden = true; $('dlRow').hidden = true;
  $('btnSend').hidden = true; $('btnRetry').hidden = true; $('btnDiscard').hidden = true;
  $('upMsg').textContent = t('discarded');
}
async function sendAll() {
  if (R.upload.state !== 'idle') return;
  const d = S.recovered || { code: S.code, device: DEVICE, events: csvText(), features: featCsv() };
  if (!S.recovered) backup();
  const items = ['events', 'features'].map(k => ({ name: d.code + '_' + d.device + '_' + k + '.csv', blob: new Blob([d[k]], { type: 'text/csv' }) }));
  const msg = $('upMsg'); msg.className = 'small';
  $('btnSend').hidden = true; $('btnRetry').hidden = true; $('dlRow').hidden = true;
  if (DEMO) { showDownloads(items); msg.textContent = t('upDemoMsg'); forgetBackup(); return; }   // the files are offered here; keep no speech text in the browser
  R.upload.state = 'running';
  try {
    for (const it of items) {
      if (R.sent[it.name]) continue;
      await uploadBlob(it.blob, it.name, 'text/csv', f => {
        $('upBar').style.width = Math.round(100 * f) + '%';
        msg.textContent = t('uploading', { n: it.name, p: Math.round(100 * f) });
      });
      R.sent[it.name] = true;
    }
    R.upload.state = 'done'; $('upBar').style.width = '100%';
    msg.textContent = t('upDone', { code: d.code }); msg.className = 'small ok';
    $('btnDiscard').hidden = true;
    forgetBackup();
  } catch (e) {
    R.upload.state = 'idle';
    msg.textContent = t('upFail');
    $('btnRetry').hidden = false; showDownloads(items);
  }
}
function recoverCheck() {
  try { if (localStorage.getItem(BACKUP_KEY)) $('recoverBar').hidden = false; } catch (e) {}
}
function recoverSend() {
  try { S.recovered = JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch (e) {}
  $('recoverBar').hidden = true;
  if (!S.recovered) return;
  S.code = S.recovered.code; S.invite = S.recovered.invite || '';
  show('s-end'); renderEnd(); $('btnSend').disabled = false; $('upMsg').textContent = '';
}

/* ---------- Camera and face features (no video or audio is recorded) ---------- */
async function enableCamera() {
  const msg = $('camMsg'); msg.textContent = '';
  S.name = curName();
  try {
    R.stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: 'user' }, audio: false });
  } catch (e) { msg.textContent = t('camDenied'); return; }
  for (const id of ['camPreview', 'camFeed']) { const v = $(id); v.srcObject = R.stream; v.muted = true; try { await v.play(); } catch (e) {} }
  $('camBox').hidden = false; $('camBtn').hidden = true; R.ready = true;
  clearInterval(R.tick);
  let n = 0;
  R.tick = setInterval(() => { n++; if (R.recording || n % 5 === 0) analyseFrame(); if (n % 5 === 0) analyseLight(); }, 100);
  loadLandmarker(); sttStart(); updateCheck(); updateStart();
}
async function loadLandmarker() {
  if (R.lm || R.lmState === 'loading') return;
  R.lmState = 'loading'; updateCheck();
  try {
    if (window.__mockLandmarker) { R.lm = window.__mockLandmarker; R.lmState = 'ready'; }
    else {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
      const mod = await import(base + '/vision_bundle.mjs');
      const fs = await mod.FilesetResolver.forVisionTasks(base + '/wasm');
      R.lm = await mod.FaceLandmarker.createFromOptions(fs, {
        baseOptions: { modelAssetPath: MP_MODEL }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true, outputFaceBlendshapes: true
      });
      R.lmState = 'ready';
    }
  } catch (e) { R.lmState = 'fail'; }
  updateCheck(); updateStart();
}
function analyseLight() {
  const v = $('camFeed'); if (v.readyState < 2) return;
  const c = R.cv || (R.cv = document.createElement('canvas')); c.width = 32; c.height = 18;
  try {
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(v, 0, 0, 32, 18);
    const d = g.getImageData(0, 0, 32, 18).data; let s = 0;
    for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    R.light = s / (d.length / 4);
  } catch (e) {}
  updateCheck();
}
// Eye direction and mouth opening from MediaPipe blendshapes. Video is not kept, so anything the
// analysis may need has to be written now. Sign of eye_h is unverified.
function eyeFeatures(res) {
  const list = res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  if (!list) return ['', '', ''];
  const b = {}; for (const c of list) b[c.categoryName] = c.score;
  const v = k => b[k] || 0;
  return [r2((v('eyeLookOutLeft') + v('eyeLookInRight') - v('eyeLookInLeft') - v('eyeLookOutRight')) / 2),
    r2((v('eyeLookUpLeft') + v('eyeLookUpRight') - v('eyeLookDownLeft') - v('eyeLookDownRight')) / 2), r2(v('jawOpen'))];
}
function analyseFrame() {
  const v = $('camFeed'); if (!R.lm || v.readyState < 2) return;
  let res = null;
  try { res = R.lm.detectForVideo(v, performance.now()); } catch (e) { return; }
  const lms = res && res.faceLandmarks && res.faceLandmarks[0];
  const tms = S.t0 == null ? 0 : Math.round(performance.now() - S.t0);
  if (!lms) { R.face = null; R.pose = { t: performance.now(), face: 0 }; if (R.recording) R.feat.push([tms, 0, '', '', '', '', '', '', '', '', '']); updateCheck(); return; }
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for (const p of lms) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
  const m = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
  const e = m ? euler(m.data) : [NaN, NaN, NaN];
  R.face = { w: x1 - x0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  R.pose = m ? { t: performance.now(), face: 1, yaw: e[0], pitch: e[1], cx: R.face.cx, cy: R.face.cy } : null;
  followFace();
  if (R.recording) R.feat.push([tms, 1, r2(e[0]), r2(e[1]), r2(e[2]), r2(x1 - x0), r2(R.face.cx), r2(R.face.cy), ...eyeFeatures(res)]);
  updateCheck();
}
function updateCheck() {
  if (!$('chkCam')) return;
  $('chkCam').textContent = R.ready ? '✓ ' + t('camOk') : '';
  $('chkLight').textContent = R.light == null ? '' : ((R.light < 60 ? '• ' : '✓ ') + t(R.light < 60 ? 'camDark' : 'camLightOk'));
  let f = '', good = false;
  if (R.lmState === 'loading') f = '• ' + t('faceLoading');
  else if (R.lmState === 'fail') f = '• ' + t('faceNA');
  else if (R.lmState === 'ready') {
    const st = posState();
    good = st === 'ok';
    f = good ? '✓ ' + t('faceOk') : '• ' + t({ none: 'faceNone', far: 'faceFar', near: 'faceNear', edge: 'faceEdge' }[st]);
  }
  $('chkFace').textContent = f;
  $('pv').classList.toggle('good', good);
  $('chkMode').textContent = !STT.SR ? '• ' + t('sttNone') : R.ready ? '✓ ' + t(STT.local ? 'sttLocal' : 'sttServer') : '';
  $('chkStt').textContent = !STT.SR || !R.ready ? '' : STT.dead ? '• ' + t('sttFail', { x: STT.dead })
    : STT.named ? '✓ ' + t('sttName') : '• ' + (STT.seen ? t('sttHeard', { x: STT.seen, n: curName() }) : t('sttWait', { n: curName() }));
}

function beginCapture() {
  S.t0 = performance.now(); S.wall0 = new Date();
  logEv('session_start', S.wall0.toISOString());
  logEv('config', 'device=' + DEVICE + ';screen=' + innerWidth + 'x' + innerHeight + ';stt=' + (STT.local ? 'local' : 'server') + ';name=' + S.name + ';robot_voice=' + (S.voiceOn ? 1 : 0) + ';checkin=' + (CONFIG.GOAL_CHECKIN ? 1 : 0) + ';offers=' + (CONFIG.ROBOT_OFFERS ? 1 : 0));
  R.recording = true; R.feat = []; R.upload = { state: 'idle' }; R.sent = {}; S.recovered = null;
  wakeLock();
  R.posT = setInterval(checkPos, 500);
}
// Phones sleep quickly; keep the screen on during the session.
async function wakeLock() { try { S.wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
function stopCapture() {
  R.recording = false;
  clearInterval(R.tick); clearInterval(R.posT); sttPause();
  if (R.stream) R.stream.getTracks().forEach(tr => tr.stop());
  if (S.wake) S.wake.release().catch(() => {});
}
function featCsv() {
  const head = ['# session_code=' + S.code, '# device=' + DEVICE, '# euler_order=YXZ (sign convention unverified)', '# rate_hz=10', '# face=0 rows are missing data, not negatives', 't_ms,face,yaw_deg,pitch_deg,roll_deg,bbox_w,cx,cy,eye_h,eye_v,jaw_open'];
  return head.concat(R.feat.map(r => r.join(','))).join('\n');
}


const MP_VER = '1.2.3';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const r2 = v => Math.round(v * 100) / 100;

// Head rotation from MediaPipe's 4x4 column-major matrix, order YXZ. Sign convention is unverified:
// check it in the pilot (turn head left/right, up/down) before interpreting signs. Analysis uses rest-pose deltas.
function euler(m) {
  const pitch = Math.asin(Math.max(-1, Math.min(1, -m[9])));
  const yaw = Math.atan2(m[8], m[10]);
  const roll = Math.atan2(m[1], m[5]);
  return [yaw, pitch, roll].map(a => a * 180 / Math.PI);
}


/* ---------- Presence: the robot's eyes follow the face ---------- */
// Uses only the face position already computed on the device by the face tracker. The reference is
// where the face was while the participant looked at the robot during calibration.
const gaze = { dx:0, dy:0, t:0 };
function followFace() {
  if (!CONFIG.GAZE_FOLLOW || !S.stageOn || !R.pose || R.pose.face !== 1 || R.pose.cx == null) return;
  const now = performance.now(); if (now - gaze.t < 400) return; gaze.t = now;
  const ref = R.gazeRef || { cx: 0.5, cy: 0.45 };
  const ox = R.pose.cx - ref.cx, oy = R.pose.cy - ref.cy;
  // The camera image is not mirrored: a face on the left of the image is on the right of the screen as the person sees it.
  gaze.dx = ox < -0.07 ? 1 : (ox > 0.07 ? -1 : 0);
  gaze.dy = oy < -0.07 ? -1 : (oy > 0.07 ? 1 : 0);
  if (!S.busy && face.emo === 'neutral' && (face.dx !== gaze.dx || face.dy !== gaze.dy)) setFace('neutral', gaze.dx, gaze.dy);
}


/* Upload through the Apps Script relay (chunks are base64 in a text/plain POST, so no CORS preflight) */
async function api(body) {
  const r = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return await r.json();
}
const b64 = buf => {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
async function uploadBlob(blob, name, mime, onProgress) {
  const init = await api({ action: 'init', invite: S.invite, name, mime, size: blob.size });
  if (!init.ok) throw new Error(init.error || 'init');
  let off = 0, fails = 0;
  while (off < blob.size) {
    const end = Math.min(off + CONFIG.CHUNK, blob.size);
    try {
      const buf = await blob.slice(off, end).arrayBuffer();
      const r = await api({ action: 'chunk', sid: init.sid, offset: off, total: blob.size, data: b64(buf) });
      if (!r.ok) throw new Error(r.error || 'chunk');
      off = typeof r.received === 'number' ? r.received : end; fails = 0;
      onProgress(off / blob.size);
    } catch (e) {
      if (++fails > 6) throw e;
      await sleep(Math.min(8000, 1000 * fails));
      try { const st = await api({ action: 'status', sid: init.sid, total: blob.size }); if (st.ok && typeof st.received === 'number') off = st.received; } catch (e2) {}
    }
  }
}
function showDownloads(items) {
  const row = $('dlRow'); row.textContent = '';
  items.forEach(it => {
    const a = document.createElement('a'); a.className = 'btn'; a.download = it.name;
    a.href = URL.createObjectURL(it.blob); a.textContent = t('btnDl2', { n: it.name }); row.appendChild(a);
  });
  row.hidden = false;
}

/* ---------- Placement drawing ---------- */
// 3/4 view of a person at a desk, right way (camera at eye height, view cone covers head and
// shoulders) and wrong way (camera low, cone only reaches the chin). No text, so captions stay in
// the page's three languages; colours are the page's theme variables, so it follows dark mode.
function guideSvg(ok, phone) {
  const h = ok ? { x: 62, y: 72 } : { x: 74, y: 86 };   // head: upright, or hunched forward
  const cam = phone ? (ok ? [197, 68] : [190, 111]) : (ok ? [181, 66] : [207, 101]);
  const cone = ok ? [[44, h.y - 30], [44, h.y + 42]] : [[56, h.y + 6], [56, h.y + 28]];
  const device = phone
    ? (ok ? '<path d="M194 118 H206 M200 118 V92" stroke="var(--muted)"/><rect x="193" y="60" width="14" height="32" rx="3" fill="var(--surface)"/>'
          : '<path d="M176 116 L208 116 L212 111 L180 111 Z" fill="var(--surface)"/>')
    : (ok ? '<path d="M168 112 L220 112 L214 118 L162 118 Z M172 106 L224 106 L218 112 L166 112 Z" fill="var(--line)" stroke="var(--muted)"/>'
            + '<path d="M172 106 L216 106 L222 100 L178 100 Z" fill="var(--surface)"/><path d="M178 100 L182 58 L191 58 L187 100 Z" fill="var(--surface)"/>'
          : '<path d="M168 118 L214 118 L220 112 L174 112 Z" fill="var(--surface)"/><path d="M180 112 L208 96 L214 100 L186 114 Z" fill="var(--surface)"/>');
  return '<svg viewBox="0 0 280 200" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="1.5" y="1.5" width="277" height="197" rx="16" stroke="var(--line)" stroke-width="1.5"/>'
    + '<ellipse cx="146" cy="184" rx="122" ry="11" fill="var(--line)" stroke="none" opacity=".7"/>'
    + '<path d="M34 138 H80 M34 138 L30 96 M40 138 V180 M76 138 V180" stroke="var(--muted)"/>'   // chair
    + '<circle cx="' + h.x + '" cy="' + h.y + '" r="13" fill="var(--surface)"/>'
    + '<circle cx="' + (h.x + 4) + '" cy="' + (h.y - 2) + '" r="1.7" fill="var(--ink)" stroke="none"/><circle cx="' + (h.x + 9) + '" cy="' + (h.y - 2) + '" r="1.7" fill="var(--ink)" stroke="none"/>'
    + (ok ? '<path d="M60 86 C58 100 56 116 56 132 M60 98 L80 112 L100 116"/>' : '<path d="M70 99 C63 109 58 120 56 132 M68 104 L86 114 L104 117"/>')   // torso, arm
    + '<path d="M56 132 L86 134 L88 178"/>'   // thigh, lower leg
    + '<path d="M108 118 L264 118 L244 136 L88 136 Z" fill="var(--surface)" stroke="var(--muted)"/>'   // desk top
    + '<path d="M88 136 V141 H244 L264 123 V118 M244 136 V141" stroke="var(--muted)"/><path d="M96 141 V182 M236 141 V182 M258 128 V170" stroke="var(--muted)"/>'
    + device
    + '<circle cx="' + cam[0] + '" cy="' + cam[1] + '" r="2.2" fill="var(--ink)" stroke="none"/>'
    + '<path d="M' + cam + ' L' + cone[0] + ' L' + cone[1] + ' Z" fill="var(' + (ok ? '--accent' : '--warn') + ')" stroke="none" opacity=".28"/>'
    + (ok ? '<path d="M76 152 H180 M76 147 V157 M180 147 V157" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="3 4"/>' : '')
    + '<circle cx="254" cy="26" r="13" fill="var(' + (ok ? '--accent' : '--warn') + ')" stroke="none"/>'
    + (ok ? '<path d="M248 26 l4 4 l8 -8" stroke="var(--bg)" stroke-width="3"/>' : '<path d="M249 21 l10 10 M259 21 l-10 10" stroke="var(--bg)" stroke-width="3"/>')
    + '</svg>';
}
function drawGuide() {
  $('guideGood').innerHTML = guideSvg(true, DEVICE === 'phone');
  $('guideBad').innerHTML = guideSvg(false, DEVICE === 'phone');
}

/* ---------- Wiring ---------- */
function updateStart() {
  const all = [...document.querySelectorAll('.chk')].every(c => c.checked) && $('consentChk').checked;
  const inviteOk = DEMO || S.invite.length >= 4;
  $('btnStart').disabled = !(all && R.ready && R.lmState === 'ready' && STT.SR && !STT.dead && inviteOk);
}
function init() {
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  S.code = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
  buildEyes(); setFace('neutral', 0, 0); idleLoop(); drawGuide();
  $('chkDevice').dataset.i = DEVICE === 'phone' ? 'chkPhone' : 'chkLaptop';
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    S.lang = b.dataset.lang; S.voiceTouched = false;
    if (STT.want) { sttPause(); STT.named = false; STT.seen = ''; sttStart(); }
    applyLang();
  }));
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshVoice;
  $('btnToSetup').onclick = () => show('s-setup');
  document.querySelectorAll('.chk').forEach(c => c.addEventListener('change', updateStart));
  $('consentChk').addEventListener('change', updateStart);
  $('voiceChk').addEventListener('change', () => { S.voiceTouched = true; });
  $('robotName').addEventListener('input', () => { STT.named = false; updateCheck(); });
  $('btnStart').onclick = () => {
    S.name = curName();
    S.voiceOn = $('voiceChk').checked && S.voiceOk;
    ac(); mainFlow();
  };
  $('btnAbort').onclick = () => { $('confirm').hidden = false; $('abortNo').focus(); };
  $('abortNo').onclick = () => { $('confirm').hidden = true; };
  $('abortYes').onclick = abortSession;
  $('enjoyBtns').onclick = e => {
    const x = e.target.closest('button'); if (!x) return;
    $('enjoyBtns').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === x)));
    logEv('enjoyment', x.dataset.v);
    if (R.upload.state === 'idle') { $('btnSend').disabled = false; $('upMsg').textContent = ''; }
  };
  $('inviteWrap').hidden = DEMO;
  $('camBtn').onclick = enableCamera;
  $('inviteIn').addEventListener('input', () => { S.invite = $('inviteIn').value.trim(); updateStart(); });
  $('btnSend').onclick = () => { logTraits(); sendAll(); };
  $('btnRetry').onclick = sendAll;
  $('btnDiscard').onclick = discardAll;
  $('btnDelAll').onclick = () => forget(S.log.filter(e => e.type === 'heard'));
  $('traitCard').addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'), q = e.target.closest('[data-q]'); if (!b || !q) return;
    S.traits[q.dataset.q] = b.dataset.v;
    q.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('btnRecover').onclick = recoverSend;
  $('btnForget').onclick = () => { forgetBackup(); $('recoverBar').hidden = true; };
  window.addEventListener('beforeunload', e => { if (R.upload.state === 'running' || R.recording) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('pagehide', backup);
  document.addEventListener('visibilitychange', () => {
    if (!R.recording) return;
    logEv(document.hidden ? 'tab_hidden' : 'tab_visible');
    if (document.hidden) backup(); else wakeLock();
  });
  // Start language: ?lang=id|en|ru wins; otherwise Russian for a Russian browser, else Indonesian.
  if (LI[QS.get('lang')] !== undefined) S.lang = QS.get('lang');
  else if ((navigator.language || '').toLowerCase().startsWith('ru')) S.lang = 'ru';
  applyLang();
  show('s-intro');
  recoverCheck();
}
init();
})();
